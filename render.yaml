services:
  - type: web
    name: cosmichorizon-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: NASA_API_KEY
        value: DEMO_KEY
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        value: hirushisandeepanee@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: CosmicHorizon <hirushisandeepanee@gmail.com>
