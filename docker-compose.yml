services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cosmichorizon-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cosmic-net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: cosmichorizon-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - cosmic-net

networks:
  cosmic-net:
    driver: bridge
